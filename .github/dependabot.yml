version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Vienna
    # frisch veröffentlichte Versionen erst nach einer Woche vorschlagen (Supply-Chain-Schutz)
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    groups:
      actions:
        patterns: ["*"]

name: Deploy GAS Kontaktformular

on:
  push:
    branches: [master]
    paths:
      - "gas/**"
      - "scripts/deploy-gas.sh"
      - ".github/workflows/deploy-gas.yml"
  workflow_dispatch:

concurrency:
  group: deploy-gas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: clasp installieren
        run: npm install --global @google/clasp@3.3.0

      - name: Deploy
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          DEPLOY_NOTE: ci ${{ github.sha }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          ./scripts/deploy-gas.sh
          rm -f "$HOME/.clasprc.json"

name: Sync ChatGPT-Pakete (Vitaltrainer/website)

# ChatGPT (nimmdaniel) committed nach website/landingpage und website/vitalos-public.
# website/dist (nimmsel23) liefert nur noch shared Assets (CSS/JS/Fonts), nicht index/vitalos.
# Import schreibt nach src/landingpage + src/vitalos (+ vitalos.html) und öffnet PR sync/gpt.

on:
  schedule:
    - cron: "0 5 * * *"   # täglich 05:00 UTC
  workflow_dispatch:

concurrency:
  group: sync-from-gpt
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
      GPT_PACKAGES_REQUIRED: "1"
    steps:
      - name: Token vorhanden?
        run: test -n "$GH_TOKEN" || { echo "::error::Secret SYNC_TOKEN fehlt"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.SYNC_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nimmsel23/Vitaltrainer
          ref: main
          path: vault
          token: ${{ secrets.SYNC_TOKEN }}
          sparse-checkout: |
            website/landingpage
            website/vitalos-public
            website/dist

      - name: Shared Assets aus dist (ohne Seiten-HTML)
        run: |
          # kein --delete: sonst würden src/landingpage und src/vitalos vor dem Import weg sein
          rsync -a \
            --exclude='*.bak' \
            --exclude='*.html' \
            --exclude='vitalos-store-links.mjs' \
            vault/website/dist/ src/

      - name: Pakete importieren (landingpage + vitalos-public)
        run: |
          export GPT_PACKAGES_ROOT="$PWD/vault/website"
          node scripts/import-gpt-packages.mjs

      - name: PR öffnen/aktualisieren
        run: |
          if [ -z "$(git status --porcelain -- src)" ]; then
            echo "Kein Unterschied zu den GPT-Paketen – nichts zu tun."; exit 0
          fi
          src_sha=$(git -C vault rev-parse --short HEAD)
          git config user.name "gpt-sync"
          git config user.email "gpt-sync@users.noreply.github.com"
          git switch -c sync/gpt
          git add -A src
          git commit -q -m "Sync: ChatGPT-Pakete landingpage + vitalos-public ($src_sha)"
          git push --force origin sync/gpt
          body="Automatischer Sync von \`Vitaltrainer/website/{landingpage,vitalos-public}@$src_sha\` nach \`src/landingpage\` + \`src/vitalos\`. Trainer-\`index.html\` bleibt unangetastet. Check muss grün sein; nach Merge deployt \`deploy.yml\`."
          gh pr create --base main --head sync/gpt --title "Sync: ChatGPT-Pakete ($src_sha)" --body "$body" \
            || gh pr edit sync/gpt --title "Sync: ChatGPT-Pakete ($src_sha)" --body "$body"

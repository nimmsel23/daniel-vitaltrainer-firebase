name: Sync ChatGPT-Pakete (Vitaltrainer/website)

# ChatGPT (nimmdaniel) committed nach website/landingpage, website/vitalos-public
# und website/dist. Dieser Sync holt sie täglich um 05:00 UTC (oder von Hand per
# workflow_dispatch). Import schreibt src/landingpage, src/vitalos (+ vitalos.html) und
# die Trainer-Kernseiten aus website/dist. PR sync/gpt. automerge.yml merged
# ihn bei grünem Check mit SYNC_TOKEN, damit deploy.yml danach läuft.

on:
  schedule:
    - cron: "0 5 * * *"   # täglich 05:00 UTC
  workflow_dispatch:

concurrency:
  group: sync-from-gpt
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
      GPT_PACKAGES_REQUIRED: "1"
    steps:
      - name: Token vorhanden?
        run: test -n "$GH_TOKEN" || { echo "::error::Secret SYNC_TOKEN fehlt"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.SYNC_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nimmsel23/Vitaltrainer
          ref: ${{ github.event.client_payload.sha || 'main' }}
          path: vault
          token: ${{ secrets.SYNC_TOKEN }}
          sparse-checkout: |
            website/landingpage
            website/vitalos-public
            website/dist

      - name: Shared Assets aus dist (ohne Seiten-HTML)
        run: |
          # kein --delete: sonst würden src/landingpage, src/vitalos und src/6pack.html vorher weg sein
          rsync -a \
            --exclude='*.bak' \
            --exclude='*.html' \
            --exclude='vitalos-store-links.mjs' \
            vault/website/dist/ src/

      - name: Trainer-Kernseiten aus dist
        run: |
          # Alle Trainer-Seiten aus dist; vitalos.html kommt aus vitalos-public, nicht aus dist.
          for p in vault/website/dist/*.html; do
            f=$(basename "$p")
            [ "$f" = vitalos.html ] && continue
            cp "$p" "src/$f"
            sed -i 's#href="/vitalos.html"#href="/vitalos/"#g' "src/$f"
          done
          node .github/scripts/apply-legal-floor.mjs

      - name: Pakete importieren (landingpage + vitalos-public)
        run: |
          export GPT_PACKAGES_ROOT="$PWD/vault/website"
          node scripts/import-gpt-packages.mjs

      - name: PR öffnen/aktualisieren
        run: |
          if [ -z "$(git status --porcelain -- src)" ]; then
            echo "Kein Unterschied zu den GPT-Paketen – nichts zu tun."; exit 0
          fi
          src_sha=$(git -C vault rev-parse --short HEAD)
          git config user.name "gpt-sync"
          git config user.email "gpt-sync@users.noreply.github.com"
          git switch -c sync/gpt
          git add -A src
          git commit -q -m "Sync: ChatGPT-Pakete landingpage + vitalos-public + Trainer-Kern ($src_sha)"
          git push --force origin sync/gpt
          body="Automatischer Sync von \`Vitaltrainer/website/{landingpage,vitalos-public,dist}@$src_sha\`.
          \`landingpage\` → \`src/landingpage\`, \`vitalos-public\` → \`src/vitalos\` (+ \`src/vitalos.html\`).
          Trainer-Kern aus \`website/dist\`: \`index.html\`, \`impressum.html\`, \`datenschutz.html\` (\`vitalos.html\` nicht aus dist; \`/vitalos.html\` wird auf \`/vitalos/\` umgeschrieben).
          Fehlt im Vault der USA-Abschnitt im Datenschutz, setzt der Legal-Floor ihn wieder ein.
          Check muss grün sein; \`automerge.yml\` merged \`sync/gpt\`, danach deployt \`deploy.yml\`."
          gh pr create --base main --head sync/gpt --title "Sync: ChatGPT-Pakete ($src_sha)" --body "$body" \
            || gh pr edit sync/gpt --title "Sync: ChatGPT-Pakete ($src_sha)" --body "$body"

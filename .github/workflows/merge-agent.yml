name: Merge-Agent

# Automatisches Mergen offener PRs auf die Ziel-Branches (TARGET_BRANCHES,
# hier "master main" – in diesem Repo ist main der Default, in anderen Repos
# z. B. master). Der Agent weist keine PRs ab und closed nie einen PR:
# mergebar + vorhandene Checks gruen (oder keine Checks) -> Squash-Merge,
# Konflikte/rote Checks -> nur Kommentar, PR bleibt offen.
# Token: SYNC_TOKEN (PAT mit Contents+Pull requests:write), damit ein Merge
# deploy.yml ausloest; ohne SYNC_TOKEN faellt er auf GITHUB_TOKEN zurueck
# (ein solcher Merge loest dann keine Push-Workflows aus).

on:
  pull_request:
  workflow_run:
    workflows: [Check]
    types: [completed]
  schedule:
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch:

concurrency:
  group: merge-agent
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  TARGET_BRANCHES: "master main"
  GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Token vorhanden?
        run: test -n "$GH_TOKEN" || { echo "::error::Weder SYNC_TOKEN noch GITHUB_TOKEN verfuegbar"; exit 1; }

      - name: Offene PRs je Ziel-Branch bearbeiten
        run: |
          repo="$GITHUB_REPOSITORY"
          owner="${repo%%/*}"

          comment() {
            local pr="$1" body="$2"
            # Pro PR nur ein Agent-Kommentar (Marker), damit es nicht spammt
            if gh api "repos/$repo/issues/$pr/comments?per_page=100" \
                --jq '.[] | select(.body | contains("[merge-agent]")) | .id' 2>/dev/null | grep -q .; then
              return 0
            fi
            gh api -X POST "repos/$repo/issues/$pr/comments" \
              -f body="[merge-agent] $body" >/dev/null
          }

          for base in $TARGET_BRANCHES; do
            gh pr list -R "$repo" --base "$base" --state open \
              --json number,title,headRefOid,headRepositoryOwner,mergeable,mergeStateStatus,isDraft \
              --jq ".[] | select(.isDraft == false) | select(.headRepositoryOwner.login == \"$owner\") | [.number, .headRefOid, .mergeable, .mergeStateStatus, .title] | @tsv" \
              2>/dev/null | while IFS=$'\t' read -r pr sha mergeable state title; do
              echo "::group::PR #$pr ($title) base=$base mergeable=$mergeable state=$state"

              conclusions=$(gh api "repos/$repo/commits/$sha/check-runs?per_page=100" --jq '[.check_runs[] | .conclusion] | join(" ")' 2>/dev/null || true)
              states=$(gh api "repos/$repo/commits/$sha/status?per_page=100" --jq '[.statuses[] | .state] | join(" ")' 2>/dev/null || true)
              failed=$(printf '%s %s\n' "$conclusions" "$states" | tr ' ' '\n' | grep -E '^(failure|cancelled|timed_out|error)$' || true)

              if [ -n "$failed" ]; then
                comment "$pr" "Check rot – PR #$pr bleibt offen und wird nicht abgewiesen. Bitte Check fixen, der Agent merged danach automatisch."
                echo "::endgroup::"; continue
              fi

              if [ "$mergeable" != "MERGEABLE" ]; then
                if gh pr update-branch "$pr" -R "$repo" --merge 2>/dev/null; then
                  echo "Base $base in PR #$pr uebernommen – naechster Lauf prueft erneut."
                else
                  comment "$pr" "Nicht mergebar ($state) – PR #$pr bleibt offen. Bitte Konflikte/Bloecke manuell aufloesen, der Agent merged danach automatisch."
                fi
                echo "::endgroup::"; continue
              fi

              if gh pr merge "$pr" -R "$repo" --squash --delete-branch; then
                echo "PR #$pr gemergt (Squash)."
              else
                comment "$pr" "Merge von PR #$pr fehlgeschlagen – PR bleibt offen und wird nicht abgewiesen."
              fi
              echo "::endgroup::"
            done
          done
